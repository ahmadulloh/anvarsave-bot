services:
  - type: web
    name: anvarsave-bot
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN_1
        sync: false
      - key: BOT_TOKEN_2
        sync: false
      - key: BOT_TOKEN_3
        sync: false
      - key: BOT_USERNAME
        value: anvarsave_bot
      - key: YOUTUBE_COOKIES
        sync: false

